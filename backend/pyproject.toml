[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "life-goals-ai-backend"
version = "1.0.0"
description = "Production backend for Life Goals AI with Firestore, Firebase Auth, Gemini AI, and Scheduled Jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.0",
    "Werkzeug==3.1.3",
    "python-dotenv==1.0.1",
    "pydantic==2.10.6",
    "firebase-admin==6.6.0",
    "gunicorn==23.0.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.7",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::FutureWarning:google.api_core.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
    "B008",  # do not perform function calls in argument defaults (standard for Pydantic Field)
]
